# Author: THEFricadelle
name: Update download badges

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute download totals
        run: python3 scripts/update_downloads.py

      - name: Commit updated badges
        run: |
          if git diff --quiet -- badges; then
            echo "Totals unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges
          git commit -m "chore: update download totals"
          git push
